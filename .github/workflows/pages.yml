# Mỗi lần main thay đổi: kiểm thử, build và đưa bản chạy được lên nhánh gh-pages (GitHub Pages phát nhánh này).
name: Trang web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Chuẩn bị trang
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - name: Đưa lên nhánh gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Cập nhật trang từ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
