# Mỗi lần main thay đổi: kiểm thử, build và đưa bản chạy được lên nhánh gh-pages (GitHub Pages phát nhánh này).
name: Trang web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Giọng cô giáo thật: liệt kê mọi câu cô nói rồi tạo giọng (chỉ tạo câu mới, phần cũ lấy từ cache).
      # Bước này lỗi cũng không sao — ứng dụng tự dùng giọng đọc của máy cho câu chưa có.
      - name: Liệt kê lời cô
        run: npx vite-node scripts/thu-giong.ts
      - uses: actions/cache/restore@v4
        with:
          path: .voice-cache
          key: giong-co-${{ github.run_id }}
          restore-keys: giong-co-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tạo giọng cô giáo
        continue-on-error: true
        timeout-minutes: 50
        run: |
          pip install -q edge-tts==7.2.8
          python scripts/tao-giong.py scripts/out/loi-co.json .voice-cache dist/voice --phut 40
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .voice-cache
          key: giong-co-${{ github.run_id }}
      - name: Chuẩn bị trang
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - name: Đưa lên nhánh gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Cập nhật trang từ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
